name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest -q

      - name: Run passing module campaign
        run: >-
          python -m live_runtime_rig
          --config examples/fastapi_sqlite/.env.example
          --public-safe

      - name: Run installed command outside repository
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          live-runtime-rig \
            --config "$GITHUB_WORKSPACE/examples/fastapi_sqlite/.env.example" \
            --public-safe

      - name: Verify intentional acceptance failure
        shell: bash
        run: |
          set +e
          output="$(
            python -m live_runtime_rig \
              --config examples/fastapi_sqlite/intentional-failure.env \
              --public-safe 2>&1
          )"
          exit_code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$exit_code" -ne 1 ]; then
            echo "Expected exit code 1, received $exit_code."
            exit 1
          fi
          grep -Fq "FRAMEWORK: COMPLETED" <<<"$output"
          grep -Fq "RESULT: FAIL" <<<"$output"
